<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Lesefluss</title>
    <style>
      /* Paint themed background immediately so the WebView doesn't flash white
         before React mounts and theme-context applies the user's saved theme. */
      html, body { margin: 0; background: #fdfcfb; }
      html.dark, body.dark { background: #0c0d0e; }
      html.sepia, body.sepia { background: #c4b081; }
      html.eink, body.eink { background: #ffffff; }
    </style>
    <script>
      // Apply cached theme synchronously so the first paint matches the user's
      // saved choice without waiting for the async DB hydrate in ThemeProvider.
      // Falls back to system dark mode if no cached value. E-ink mode overrides
      // the theme with light, as theme-context does once settings load.
      (() => {
        try {
          const cached = localStorage.getItem("app-theme");
          const sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const eink = localStorage.getItem("app-eink") === "1";
          const t = eink ? "light" : cached || sys;
          // Only <html>: <body> does not exist yet while <head> is parsed.
          // theme-context puts the same classes on both once it mounts.
          document.documentElement.classList.add(t);
          if (eink) document.documentElement.classList.add("eink");
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
