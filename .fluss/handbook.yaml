solutions:
  ui_rules:
    status: addition
    title: Lesefluss main tasks, placement, loading and themes
    body: |-
      **Main tasks** the UI check walks, on the phone first (390 px), each in the fewest taps the
      rules allow. The whole list runs only when the user starts `/fluss-ui-check all`; a round,
      and `/fluss-ui-check` on a ticket, a branch or the working diff, checks only that change:
      1. Continue reading the current book from the Library.
      2. Start a new book from the Library.
      3. Change font size and theme while reading: at most 2 taps, through an Aa control in the
         reader header.
      4. Set a daily goal and check today's progress.
      5. Find your reading speed.
      6. Find and fix a wrong reading session.
      7. Add a book to a series.
      8. Import a book.
      9. Find a setting, such as the speed window or the RSVP speed.
      10. Get back with Android back: close the overlay, then leave the collapse or mode, then the
          sub-page to its parent, then a root tab to the Library, then exit; never into old
          cross-tab history.
      11. Create a collection from the Library (desktop sidebar and phone).
      12. Create a series from the Library (desktop sidebar and phone).

      For every main task the check asks whether a new user would find its entry point.

      **Placement**
      - Every setting lives on a Settings sub-page with an icon, never loose in the Settings root.
      - Appearance is reached from the reader header (Aa), not from the ⋮ menu; the ⋮ menu holds
        rare reading actions only.
      - Destructive actions (Delete, Reset progress, Delete all sessions) sit in a separate danger
        group, never last in a reading menu or a list.
      - The default Library card shows title, author and progress (percent, or Finished); series,
        rating, time to read and other fields are opt-in in the View sheet (LESE-190.6, LESE-211.32).
      - A sheet has a left-aligned title, keeps the page gutter and clears the gesture bar.

      **Layout** (the user's numbers, LESE-211)
      - Text pages (settings, social, stats, book page, edit pages) are at most 768 px wide; book
        grids (library, collections, series, smart shelves, Explore) at most 1280 px, with more
        columns on wide screens; the reader's text column is at most 700 px and a line of about
        65-70 characters (narrower at small text sizes), with its header row and footer on the
        same column; the header and footer stay on the text column across scroll, page and RSVP.
      - Every page is centred in the space beside the sidebar, and its header aligns with the same
        column.
      - Library, collection, smart shelf and series pages share one book view.
      - The check compares page widths across pages at 1280, 1920 and 2560 px, side by side; a
        page that is wider, narrower or off-centre against its kind is a finding, not taste.
      - Short single-column flows (onboarding, dialogs shown as pages, empty states) centre
        vertically between their header and footer on tall screens; content that changes height
        in place (the speed test) sits at the top of a centred box of fixed height instead. The
        check looks at tall windows too (1280x1600, 1920x1080, 2560x1440), not only phone height
        (LESE-211.18).

      **Desktop buttons:** a button is as wide as its label on desktop; full width is for phones
      only (sheets, forms and a page's primary action).

      **Menus**
      - No menu with a single item: show that action directly.
      - A menu trigger is always visible, never hover-only.
      - On a fine pointer a menu opens anchored at its trigger, never as a bottom sheet.
      - On touch every menu opens as a bottom sheet, whatever its item count.
      - Near a viewport edge a menu or popover flips or shifts to stay fully on screen, keeping at
        least the page gutter to the edge; never clipped, never off screen.
      - All desktop menus and popovers share one row height and text size.

      **Create flows**
      - One presentation (page or dialog) per create kind: collection, series and smart shelf are
        created the same way.
      - A page's create action uses one button variant across pages.
      - A "New X" screen offers no toggle that turns it into another kind.

      **Desktop sidebar:** at 1280x720 and 1262x606 every section heading (Smart shelves,
      Collections, Series) and its + are visible without scrolling the sidebar; the footer yields
      space, and long lists scroll inside their section.

      **States**
      - A failed load never also shows "nothing here" rows derived from it; the error replaces
        them.
      - Content that expands below the fold (a form opened in place, a disclosure) scrolls itself
        into view.

      **Discoverability:** every create or manage action for a kind of thing is reachable from
      where that thing is listed.

      **Loading** (the user's rule, 2026-11-09): a data card reserves its loaded height. A skeleton
      only when its height matches the loaded height exactly, else a spinner in a box of that
      height. Never merge queries just to avoid a shift: it costs load time and navigation delay.

      **Themes:** dark (default), sepia, light and high contrast (`dark high-contrast`, white on
      black with yellow accents), plus e-ink mode, which renders light with a grey-safe palette
      (`apps/capacitor/src/theme/`). Every screen works in all of them. The reader theme is the
      app theme: picking one in the reader changes the whole app (LESE-190.7). The four themes
      change colours only, never font size, weight or spacing; e-ink mode may add borders, bold
      and underline cues. High contrast shows no non-HC accent colours (today rings, avatars,
      badges keep the yellow palette). Status colours are theme tokens (`success`, `warning`,
      `info`, `heat` for a ramp, `mark` for a search hit) that every theme defines, high contrast
      in its yellow palette and e-ink in black with a non-colour cue; no screen uses a raw
      palette or hex colour except a theme swatch or a user-chosen colour. A row icon stays muted
      and its state is said in the subtitle.

      **UI check viewports:** a short laptop (1262x606 or 1280x720), 1280x800, 1920x1080,
      2560x1440, tall 1280x1600 and a 390 px phone. Real pointer clicks (Playwright mouse or
      `locator.click`), never programmatic `element.click()`, decide whether a menu opens and
      where.

      **Gap scale:** the fluss standard as Tailwind steps `1`, `2`, `3`, `4`, `6`, `8` (4, 8, 12,
      16, 24, 32 px at the default 16 px App font size; spacing scales with it, as it is in rem);
      `packages/ui` defines no spacing tokens of its own. Related items sit closer than unrelated
      ones, and no space is reserved for content that isn't there. A page's frame has one value per
      role: header to first row 12, control row to control row 8, last control row to content 12,
      one bottom padding (larger only under a phone's floating button or fixed bar), from
      `PageBody` and `PageToolbar` in `components/page-body.tsx`.

      **Roles:** one role, one value on every screen, from one shared component, token or
      formatter; a page never rebuilds a role with its own values. The greppable ones are gated by
      `apps/capacitor/src/components/__tests__/ui-rules.test.ts`; a line that must differ carries
      `// ui-rules-allow: <rule> -- <reason>`.
      - Facts with one source and formatter: goal progress, reading time totals, wpm, time left,
        series counts; sittings under a minute count nowhere. Counts, dates, clock times and
        relative times are formatted only in `apps/capacitor/src/utils/` (and `packages/ui/src/lib/`),
        in one locale whatever the device's, with one unit spelling: "12 min ago", "3h ago",
        "5d ago", "15d", "39 min left". Count columns use tabular figures.
      - Motion: a CSS transition names its properties (Tailwind's bare `transition`, or
        `transition-colors`/`-opacity`/`-transform`), never `all`, with the one shared ease-out
        and 150, 200 or 300 ms. Scripted entrances (framer-motion) are not on these timings yet.
        Hover steps the colour or surface and never scales; a press scales to 0.97. Progress
        fills animate a transform; only layout that must reflow animates width or padding.
      - Type: interface sizes come from the scale `2xs` 11, `xs` 12, `sm` 14, `base` 16, `lg` 18,
        `xl` 20, `2xl` 24, `4xl` 36 (rem, so they follow the App text size), weights 400, 500 and
        600 only. Reader content, SVG chart text, the RSVP word and cover artwork keep their own
        sizes with an allow comment; e-ink may add bold as a cue.
      - Section: one `Section` and `SectionHeader` (`components/section-header.tsx`) own a
        section's rhythm, 24 to the section before and 8 from the title to its content, and its
        title: 16px semibold in sentence case. A heading that cannot be a SectionHeader takes
        `SECTION_TITLE`; no uppercase tracked section titles. Spacing sits on the 4px grid, never
        an arbitrary px or a half step from 2 up; gaps use the scale's steps only.
      - Rows, cards, covers: one `LIST_ROW` (48 tall, 12 between parts, 16 inset in an
        edge-to-edge group, none inside a card; label sm, sub line xs muted, value sm tabular),
        one `Card`/`CARD` (`components/card.tsx`: radius xl, padding 16, title and blocks 12
        apart, card and border tokens only, tiles inside p-3), and one cover radius per size
        class: thumbs and grid covers `rounded-sm`, a standalone feature cover `rounded-md`.
        Radii come from the scale, never an arbitrary `rounded-[…]`.
      - Captions and card titles: a figure's caption is xs muted in sentence case (`StatTile`,
        `STAT_CAPTION`), never uppercase-tracked; badges and the reader's chips may be. A title
        under a cover is `CARD_TITLE` (14px medium, two lines at most, no reserved second line).
        Headlines carry no closing full stop.
      - Controls: one `SearchField` (32px, search glyph, clear button), one `FilterChip` and
        `FilterMenuChip`, one `HeaderAction` (32px, 20px glyph) for header icons and one
        `CountBadge`, all in `packages/ui`. Every tappable control has a 44px target on touch,
        from a pseudo-element hit area, never by growing its look.
      - Icons: one size per role tier, set by the role component, not at the call site: 16 inline
        and in buttons and chips, 20 in headers, rows and nav (`HeaderAction`, `LIST_ROW`, a
        dialog or sheet close; a row's trailing chevron 16), 32 for an empty, error or loading
        state that stands in for content (`EmptyState`, `ReservedCard`). A 12 or 14 glyph next
        to xs text is fine. The reader and cover art keep their own sizes.

      **Beyond the standard**
      - Every screen is reviewed in its empty, few-data and full states, in dark and light.
    codePaths:
      - apps/capacitor/src/theme/
      - apps/capacitor/src/contexts/theme-context.tsx
      - packages/ui/src/
    decisionTicket: LESE-190
